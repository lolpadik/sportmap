{% extends "base.html" %}
{% block content %}
<style>
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
    }
    @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-80px); }
        to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(80px); }
        to { opacity: 1; transform: translateX(0); }
    }
    @keyframes typing {
        from { max-width: 0; }
        to { max-width: 100%; }
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }
    .animate-title { animation: fadeInUp 0.8s ease-out; color: #1a1a2e; }
    .typing-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 40px;
        max-width: 90vw;
        margin: 0 auto;
    }
    .typing-text {
        overflow: hidden;
        white-space: nowrap;
        max-width: 0;
        animation: typing 2s steps(40) 0.5s forwards;
        font-size: clamp(0.8rem, 3vw, 1.25rem);
        color: #1a1a2e;
    }
    .typing-cursor {
        display: inline-block;
        width: 3px;
        height: 28px;
        background: #8b5cf6;
        margin-left: 2px;
        animation: blink 0.7s step-end infinite;
        flex-shrink: 0;
    }
    .typing-cursor.hidden { animation: none; opacity: 0; }
    .animate-btn { animation: fadeInUp 0.8s ease-out 2.5s both, pulse 2s ease-in-out 3.5s infinite; }
    .icon-1 { animation: slideInLeft 0.8s ease-out 0.1s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .icon-2 { animation: slideInLeft 0.8s ease-out 0.2s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .icon-3 { animation: slideInLeft 0.8s ease-out 0.3s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .icon-4 { animation: slideInRight 0.8s ease-out 0.4s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .icon-5 { animation: slideInRight 0.8s ease-out 0.3s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .icon-6 { animation: slideInRight 0.8s ease-out 0.2s both; font-size: clamp(1.5rem, 4vw, 2rem); }
    .hero-bg {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        background: #f1f5f9;
    }
    [data-bs-theme="dark"] .hero-bg { background: #2d172b; }
    [data-bs-theme="dark"] .animate-title { color: #fff; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
    [data-bs-theme="dark"] .typing-text { color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
    [data-bs-theme="dark"] .typing-cursor { background: #ffc107; }
</style>

<div class="hero-bg"></div>

<div class="text-center d-flex flex-column justify-content-center align-items-center px-3" style="min-height: 80vh;">
    <div class="d-flex align-items-center justify-content-center gap-2 gap-md-3 mb-4 flex-wrap">
        <span class="icon-1">⚽</span>
        <span class="icon-2">🏀</span>
        <span class="icon-3">🏐</span>
        <span class="icon-4">🎾</span>
        <span class="icon-5">🏒</span>
        <span class="icon-6">🛹</span>
    </div>

    <h1 class="fw-bold animate-title mb-3" style="font-size: clamp(1.5rem, 6vw, 3.5rem);">
        {{ t.find_play }}
    </h1>

    <div class="typing-wrapper mb-4">
        <span class="lead typing-text">
            {{ t.all_grounds }}
        </span>
        <span class="typing-cursor" id="cursor"></span>
    </div>

    <a href="/map?lang={{ lang }}" class="btn btn-warning btn-lg px-4 px-md-5 py-2 py-md-3 animate-btn" style="font-weight: bold; border-radius: 50px; font-size: clamp(0.9rem, 3vw, 1.3rem);">
        <i class="ph ph-map-pin"></i> {{ t.open_map }}
    </a>
</div>

<script>
setTimeout(function() {
    document.getElementById('cursor').classList.add('hidden');
}, 2500);
</script>
{% endblock %}
